<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏠 Project Knowledge Base — Ampas Industries</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-secondary: #12121a;
      --card: #16161f;
      --border: #252535;
      --text: #e8e8ed;
      --text-secondary: #a0a0b0;
      --muted: #6b6b80;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
      --blue: #60a5fa;
      --gradient-hero: linear-gradient(135deg, #0f0c29 0%, #1a1040 40%, #24243e 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ===== Header ===== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(18,18,26,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      z-index: 100;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== Portal Container ===== */
    .portal {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 80px 24px 40px;
    }

    /* ===== True 3D Wrench ===== */
    .wrench-stage {
      width: 300px;
      height: 350px;
      perspective: 1000px;
      position: relative;
    }
    .wrench-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: wrenchSpin 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: center center;
    }
    @keyframes wrenchSpin {
      0%   { transform: rotateX(-15deg) rotateY(0deg) rotateZ(0deg); }
      25%  { transform: rotateX(-5deg) rotateY(90deg) rotateZ(5deg); }
      50%  { transform: rotateX(-15deg) rotateY(180deg) rotateZ(0deg); }
      75%  { transform: rotateX(-25deg) rotateY(270deg) rotateZ(-5deg); }
      100% { transform: rotateX(-15deg) rotateY(360deg) rotateZ(0deg); }
    }

    /* -- Handle (rectangular prism) -- */
    .handle {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 120px;
      transform-style: preserve-3d;
    }
    .handle .face {
      position: absolute;
      backface-visibility: visible;
    }
    .handle .front {
      width: 22px; height: 120px;
      background: linear-gradient(180deg, #5a6577 0%, #3d4654 50%, #5a6577 100%);
      transform: translateZ(11px);
      border-radius: 3px;
    }
    .handle .back {
      width: 22px; height: 120px;
      background: linear-gradient(180deg, #4a5568 0%, #2d3748 50%, #4a5568 100%);
      transform: translateZ(-11px) rotateY(180deg);
      border-radius: 3px;
    }
    .handle .left {
      width: 22px; height: 120px;
      background: linear-gradient(180deg, #3d4654 0%, #2d3748 100%);
      transform: translateX(-11px) rotateY(-90deg);
      transform-origin: left center;
    }
    .handle .right {
      width: 22px; height: 120px;
      background: linear-gradient(180deg, #6b7a8d 0%, #4a5568 100%);
      transform: translateX(11px) rotateY(90deg);
      transform-origin: right center;
    }
    .handle .top {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, #718096, #5a6577);
      transform: translateY(-11px) rotateX(90deg);
      transform-origin: top center;
      border-radius: 3px 3px 0 0;
    }
    .handle .bottom {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, #3d4654, #2d3748);
      transform: translateY(120px) rotateX(-90deg);
      transform-origin: bottom center;
      border-radius: 0 0 3px 3px;
    }

    /* -- Head (box with jaw opening) -- */
    .head {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 60px;
      transform-style: preserve-3d;
    }
    .head .face {
      position: absolute;
      backface-visibility: visible;
    }
    .head .front {
      width: 80px; height: 60px;
      background: linear-gradient(135deg, #718096 0%, #4a5568 50%, #5a6577 100%);
      transform: translateZ(11px);
      border-radius: 8px 8px 4px 4px;
    }
    .head .back {
      width: 80px; height: 60px;
      background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
      transform: translateZ(-11px) rotateY(180deg);
      border-radius: 8px 8px 4px 4px;
    }
    .head .left {
      width: 22px; height: 60px;
      background: linear-gradient(180deg, #3d4654, #2d3748);
      transform: translateX(-11px) rotateY(-90deg);
      transform-origin: left center;
    }
    .head .right {
      width: 22px; height: 60px;
      background: linear-gradient(180deg, #6b7a8d, #4a5568);
      transform: translateX(80px) rotateY(90deg);
      transform-origin: left center;
    }
    .head .top {
      width: 80px; height: 22px;
      background: linear-gradient(90deg, #718096, #5a6577, #718096);
      transform: translateY(-11px) rotateX(90deg);
      transform-origin: top center;
      border-radius: 8px 8px 0 0;
    }
    .head .bottom {
      width: 80px; height: 22px;
      background: linear-gradient(90deg, #3d4654, #2d3748, #3d4654);
      transform: translateY(60px) rotateX(-90deg);
      transform-origin: bottom center;
    }

    /* -- Jaw Left -- */
    .jaw-left {
      position: absolute;
      top: -5px;
      left: 2px;
      width: 26px;
      height: 40px;
      transform-style: preserve-3d;
    }
    .jaw-left .face {
      position: absolute;
      backface-visibility: visible;
    }
    .jaw-left .front {
      width: 26px; height: 40px;
      background: linear-gradient(180deg, #718096, #5a6577);
      transform: translateZ(11px);
      border-radius: 8px 4px 2px 4px;
    }
    .jaw-left .back {
      width: 26px; height: 40px;
      background: linear-gradient(180deg, #4a5568, #3d4654);
      transform: translateZ(-11px) rotateY(180deg);
      border-radius: 8px 4px 2px 4px;
    }
    .jaw-left .top {
      width: 26px; height: 22px;
      background: linear-gradient(90deg, #718096, #6b7a8d);
      transform: translateY(-11px) rotateX(90deg);
      transform-origin: top center;
      border-radius: 8px 8px 0 0;
    }

    /* -- Jaw Right -- */
    .jaw-right {
      position: absolute;
      top: -5px;
      right: 2px;
      width: 26px;
      height: 40px;
      transform-style: preserve-3d;
    }
    .jaw-right .face {
      position: absolute;
      backface-visibility: visible;
    }
    .jaw-right .front {
      width: 26px; height: 40px;
      background: linear-gradient(180deg, #718096, #5a6577);
      transform: translateZ(11px);
      border-radius: 4px 8px 4px 2px;
    }
    .jaw-right .back {
      width: 26px; height: 40px;
      background: linear-gradient(180deg, #4a5568, #3d4654);
      transform: translateZ(-11px) rotateY(180deg);
      border-radius: 4px 8px 4px 2px;
    }
    .jaw-right .top {
      width: 26px; height: 22px;
      background: linear-gradient(90deg, #6b7a8d, #718096);
      transform: translateY(-11px) rotateX(90deg);
      transform-origin: top center;
      border-radius: 8px 8px 0 0;
    }

    /* -- Jaw Inner (opening) -- */
    .jaw-inner {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 18px;
      transform-style: preserve-3d;
    }
    .jaw-inner .face {
      position: absolute;
      backface-visibility: visible;
    }
    .jaw-inner .front {
      width: 28px; height: 18px;
      background: #1a1a26;
      transform: translateZ(12px);
      border-radius: 2px;
    }
    .jaw-inner .back {
      width: 28px; height: 18px;
      background: #0f0f17;
      transform: translateZ(-12px) rotateY(180deg);
      border-radius: 2px;
    }

    /* -- Neck (connection) -- */
    .neck {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 25px;
      transform-style: preserve-3d;
    }
    .neck .face {
      position: absolute;
      backface-visibility: visible;
    }
    .neck .front {
      width: 30px; height: 25px;
      background: linear-gradient(180deg, #5a6577, #4a5568);
      transform: translateZ(11px);
      clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
    }
    .neck .back {
      width: 30px; height: 25px;
      background: linear-gradient(180deg, #3d4654, #2d3748);
      transform: translateZ(-11px) rotateY(180deg);
      clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
    }

    /* -- Reflection / Specular highlight -- */
    .specular {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) translateZ(12px);
      width: 60px;
      height: 8px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ===== Shadow ===== */
    .wrench-shadow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 20px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
      animation: shadowPulse 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes shadowPulse {
      0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.6; }
      25% { transform: translateX(-30%) scaleX(0.8); opacity: 0.4; }
      50% { transform: translateX(-50%) scaleX(1.1); opacity: 0.5; }
      75% { transform: translateX(-70%) scaleX(0.9); opacity: 0.4; }
    }

    /* ===== Portal Content ===== */
    .portal-content {
      text-align: center;
      z-index: 10;
    }
    .portal-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .portal-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ===== Stats ===== */
    .portal-stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .stat-item {
      text-align: center;
      padding: 12px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 80px;
    }
    .stat-item .num {
      font-size: 24px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-item .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ===== Portal Button ===== */
    .portal-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      background: var(--gradient-hero);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .portal-btn:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(96,165,250,0.2);
    }
    .portal-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }
    .portal-btn:hover::before { left: 100%; }
    .portal-btn .icon { font-size: 20px; }
    .portal-btn .arrow { font-size: 14px; opacity: 0.6; transition: opacity 0.3s; }
    .portal-btn:hover .arrow { opacity: 1; }

    /* ===== Footer ===== */
    .portal-footer {
      position: fixed;
      bottom: 16px;
      font-size: 11px;
      color: var(--muted);
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .portal-title { font-size: 24px; }
      .wrench-stage { width: 200px; height: 250px; }
      .portal-stats { gap: 10px; }
      .stat-item { min-width: 60px; padding: 8px 12px; }
      .stat-item .num { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1><span>🏠</span> Project Knowledge Base</h1>
  </div>

  <!-- Portal -->
  <div class="portal">
    <!-- 3D Wrench -->
    <div class="wrench-stage">
      <div class="wrench-3d">
        <!-- Head -->
        <div class="head">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face left"></div>
          <div class="face right"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
          <!-- Jaw Left -->
          <div class="jaw-left">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face top"></div>
          </div>
          <!-- Jaw Right -->
          <div class="jaw-right">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face top"></div>
          </div>
          <!-- Jaw Inner -->
          <div class="jaw-inner">
            <div class="face front"></div>
            <div class="face back"></div>
          </div>
          <!-- Specular highlight -->
          <div class="specular"></div>
        </div>
        <!-- Neck -->
        <div class="neck">
          <div class="face front"></div>
          <div class="face back"></div>
        </div>
        <!-- Handle -->
        <div class="handle">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face left"></div>
          <div class="face right"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
        </div>
      </div>
      <div class="wrench-shadow"></div>
    </div>

    <!-- Content -->
    <div class="portal-content">
      <h2 class="portal-title">Project Knowledge Base</h2>
      <p class="portal-subtitle">Ampas Industries — Process Engineering Documentation Hub</p>

      <!-- Stats -->
      <div class="portal-stats">
        <div class="stat-item">
          <div class="num" style="color:var(--blue)">18</div>
          <div class="label">Projects</div>
        </div>
        <div class="stat-item">
          <div class="num" style="color:var(--green)">15</div>
          <div class="label">Worked</div>
        </div>
        <div class="stat-item">
          <div class="num" style="color:var(--red)">1</div>
          <div class="label">Failed</div>
        </div>
        <div class="stat-item">
          <div class="num" style="color:var(--amber)">2</div>
          <div class="label">Pitfall</div>
        </div>
      </div>

      <!-- Portal Link -->
      <a href="project-knowledge-base.html" class="portal-btn">
        <span class="icon">📋</span>
        View All Projects
        <span class="arrow">→</span>
      </a>
    </div>
  </div>

  <!-- Footer -->
  <div class="portal-footer">Ampas Industries Co., Ltd. — PE Documentation Hub</div>

</body>
</html>
