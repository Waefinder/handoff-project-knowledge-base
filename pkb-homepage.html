<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏠 Ampas Industries Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #16161f;
      --border: #252535;
      --text: #e8e8ed;
      --text-secondary: #a0a0b0;
      --muted: #6b6b80;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
      --blue: #60a5fa;
      --road: #2a2a3a;
      --road-line: #4a4a5a;
      --grass: #1a2a1a;
      --building-1: #1e2a3a;
      --building-2: #2a1e3a;
      --building-3: #3a2a1e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== ANIMATED BACKGROUND (Fixed) ===== */
    .bg-scene {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--grass);
    }

    /* -- Grass texture -- */
    .bg-scene::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, #1f3a1f 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, #1a3a1a 0%, transparent 25%),
        radial-gradient(circle at 50% 50%, #1a2a1a 0%, transparent 40%);
    }

    /* -- Roads -- */
    .road-h {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 80px;
      transform: translateY(-50%);
      background: var(--road);
    }
    .road-v {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 80px;
      transform: translateX(-50%);
      background: var(--road);
    }
    /* Road lines - horizontal */
    .road-h::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(90deg, var(--road-line) 0px, var(--road-line) 20px, transparent 20px, transparent 40px);
    }
    /* Road lines - vertical */
    .road-v::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(180deg, var(--road-line) 0px, var(--road-line) 20px, transparent 20px, transparent 40px);
    }

    /* -- Intersection center -- */
    .intersection {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      background: var(--road);
      z-index: 2;
    }

    /* -- Buildings (top-left) -- */
    .building { position: absolute; border-radius: 4px; }
    .building::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    .b1 { width: 60px; height: 90px; background: var(--building-1); top: 8%; left: 8%; z-index: 1; }
    .b1::after { width: 12px; height: 16px; top: 10px; left: 8px; box-shadow: 18px 0 0 rgba(255,255,255,0.1), 36px 0 0 rgba(255,255,255,0.1), 0 24px 0 rgba(255,255,255,0.1), 18px 24px 0 rgba(255,255,255,0.1); }
    .b2 { width: 45px; height: 70px; background: var(--building-2); top: 12%; left: 18%; z-index: 1; }
    .b2::after { width: 10px; height: 14px; top: 8px; left: 6px; box-shadow: 14px 0 0 rgba(255,255,255,0.1), 0 20px 0 rgba(255,255,255,0.1); }
    .b3 { width: 50px; height: 80px; background: var(--building-3); top: 6%; right: 10%; z-index: 1; }
    .b3::after { width: 11px; height: 15px; top: 10px; left: 7px; box-shadow: 16px 0 0 rgba(255,255,255,0.1), 0 22px 0 rgba(255,255,255,0.1); }
    .b4 { width: 55px; height: 65px; background: var(--building-1); bottom: 10%; left: 12%; z-index: 1; }
    .b4::after { width: 10px; height: 14px; top: 8px; left: 8px; box-shadow: 16px 0 0 rgba(255,255,255,0.1), 32px 0 0 rgba(255,255,255,0.1); }
    .b5 { width: 40px; height: 55px; background: var(--building-2); bottom: 15%; right: 15%; z-index: 1; }
    .b5::after { width: 8px; height: 12px; top: 8px; left: 6px; box-shadow: 12px 0 0 rgba(255,255,255,0.1); }
    .b6 { width: 48px; height: 75px; background: var(--building-3); bottom: 8%; right: 8%; z-index: 1; }
    .b6::after { width: 10px; height: 14px; top: 10px; left: 7px; box-shadow: 14px 0 0 rgba(255,255,255,0.1), 0 20px 0 rgba(255,255,255,0.1); }

    /* -- Trees -- */
    .tree { position: absolute; z-index: 1; }
    .tree-trunk {
      width: 6px;
      height: 20px;
      background: #5a4a3a;
      margin: 0 auto;
      border-radius: 2px;
    }
    .tree-top {
      width: 24px;
      height: 24px;
      background: #2a5a2a;
      border-radius: 50%;
      margin-bottom: -4px;
    }
    .t1 { top: 25%; left: 30%; }
    .t2 { top: 30%; right: 25%; }
    .t3 { bottom: 25%; left: 28%; }
    .t4 { bottom: 30%; right: 30%; }

    /* ===== CARS (Animated) ===== */
    .car {
      position: absolute;
      z-index: 3;
    }
    .car-body {
      position: relative;
      border-radius: 4px;
    }

    /* -- Car going RIGHT on horizontal road -- */
    .car-right {
      top: calc(50% - 12px);
      animation: driveRight 12s linear infinite;
    }
    .car-right .car-body {
      width: 40px;
      height: 16px;
      background: #e74c3c;
      border-radius: 4px 8px 4px 4px;
    }
    .car-right .car-body::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 8px;
      width: 20px;
      height: 10px;
      background: #c0392b;
      border-radius: 4px 6px 0 0;
    }
    .car-right .wheel {
      position: absolute;
      bottom: -4px;
      width: 8px;
      height: 8px;
      background: #222;
      border-radius: 50%;
      border: 1px solid #444;
    }
    .car-right .wheel.front { right: 4px; }
    .car-right .wheel.rear { left: 4px; }
    @keyframes driveRight {
      0% { left: -50px; transform: rotate(0deg); }
      45% { left: calc(50% - 20px); transform: rotate(0deg); }
      50% { left: calc(50% - 20px); transform: rotate(-90deg); transform-origin: center center; }
      55% { left: calc(50% - 20px); top: calc(50% + 30px); transform: rotate(-90deg); }
      100% { left: calc(50% - 20px); top: 110%; transform: rotate(-90deg); }
    }

    /* -- Car going LEFT on horizontal road -- */
    .car-left {
      top: calc(50% + 4px);
      animation: driveLeft 14s linear infinite;
      animation-delay: -3s;
    }
    .car-left .car-body {
      width: 38px;
      height: 15px;
      background: #3498db;
      border-radius: 8px 4px 4px 4px;
    }
    .car-left .car-body::before {
      content: '';
      position: absolute;
      top: -5px;
      right: 8px;
      width: 18px;
      height: 9px;
      background: #2980b9;
      border-radius: 6px 4px 0 0;
    }
    .car-left .wheel {
      position: absolute;
      bottom: -4px;
      width: 8px;
      height: 8px;
      background: #222;
      border-radius: 50%;
      border: 1px solid #444;
    }
    .car-left .wheel.front { left: 4px; }
    .car-left .wheel.rear { right: 4px; }
    @keyframes driveLeft {
      0% { right: -50px; transform: rotate(180deg); }
      40% { right: calc(50% - 20px); transform: rotate(180deg); }
      50% { right: calc(50% - 20px); transform: rotate(270deg); }
      55% { right: calc(50% - 20px); top: calc(50% - 60px); transform: rotate(270deg); }
      100% { right: calc(50% - 20px); top: -60px; transform: rotate(270deg); }
    }

    /* -- Car going DOWN on vertical road -- */
    .car-down {
      left: calc(50% + 8px);
      animation: driveDown 10s linear infinite;
      animation-delay: -5s;
    }
    .car-down .car-body {
      width: 16px;
      height: 36px;
      background: #f39c12;
      border-radius: 4px 4px 8px 4px;
      transform: rotate(90deg);
    }
    .car-down .car-body::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 2px;
      width: 12px;
      height: 10px;
      background: #e67e22;
      border-radius: 4px 6px 0 0;
      transform: rotate(-90deg);
      transform-origin: bottom center;
    }
    .car-down .wheel {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #222;
      border-radius: 50%;
      border: 1px solid #444;
    }
    .car-down .wheel.front { bottom: 4px; left: -8px; }
    .car-down .wheel.rear { top: 4px; left: -8px; }
    @keyframes driveDown {
      0% { top: -50px; }
      45% { top: calc(50% - 18px); }
      50% { top: calc(50% - 18px); }
      55% { left: calc(50% - 60px); }
      100% { left: calc(50% - 60px); top: 110%; }
    }

    /* -- Car going UP on vertical road -- */
    .car-up {
      left: calc(50% - 24px);
      animation: driveUp 11s linear infinite;
      animation-delay: -7s;
    }
    .car-up .car-body {
      width: 16px;
      height: 34px;
      background: #9b59b6;
      border-radius: 8px 4px 4px 4px;
      transform: rotate(-90deg);
    }
    .car-up .car-body::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 2px;
      width: 12px;
      height: 9px;
      background: #8e44ad;
      border-radius: 6px 4px 0 0;
      transform: rotate(90deg);
      transform-origin: bottom center;
    }
    .car-up .wheel {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #222;
      border-radius: 50%;
      border: 1px solid #444;
    }
    .car-up .wheel.front { top: 4px; right: -8px; }
    .car-up .wheel.rear { bottom: 4px; right: -8px; }
    @keyframes driveUp {
      0% { bottom: -50px; }
      45% { bottom: calc(50% - 17px); }
      50% { bottom: calc(50% - 17px); }
      55% { left: calc(50% + 20px); }
      100% { left: calc(50% + 20px); bottom: 110%; }
    }

    /* ===== PORTAL CONTENT ===== */
    .portal-overlay {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 40px;
      gap: 32px;
    }

    /* -- Header -- */
    .portal-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      z-index: 100;
      text-align: center;
    }
    .portal-header h1 {
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* -- Stats -- */
    .portal-stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat-item {
      text-align: center;
      padding: 16px 24px;
      background: rgba(22,22,31,0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-width: 90px;
    }
    .stat-item .num {
      font-size: 28px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-item .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* -- Portal Button -- */
    .portal-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 36px;
      background: rgba(22,22,31,0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .portal-btn:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(96,165,250,0.2);
    }
    .portal-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: left 0.5s;
    }
    .portal-btn:hover::before { left: 100%; }
    .portal-btn .icon { font-size: 20px; }
    .portal-btn .arrow { font-size: 14px; opacity: 0.6; transition: opacity 0.3s; }
    .portal-btn:hover .arrow { opacity: 1; }

    /* -- 3D Wrench (Connected) -- */
    .wrench-wrapper {
      perspective: 800px;
      width: 120px;
      height: 220px;
    }
    .wrench-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: wrenchSpin 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes wrenchSpin {
      0%   { transform: rotateX(-10deg) rotateY(0deg); }
      25%  { transform: rotateX(5deg) rotateY(90deg); }
      50%  { transform: rotateX(-10deg) rotateY(180deg); }
      75%  { transform: rotateX(-20deg) rotateY(270deg); }
      100% { transform: rotateX(-10deg) rotateY(360deg); }
    }

    /* Single wrench piece using box-shadows for 3D depth */
    .wrench-main {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 200px;
      transform-style: preserve-3d;
    }

    /* Handle bar */
    .wrench-bar {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 120px;
      background: linear-gradient(90deg, #3d4654 0%, #6b7a8d 30%, #8a9aac 50%, #6b7a8d 70%, #3d4654 100%);
      border-radius: 4px;
      box-shadow: 
        -2px 0 0 #2d3748,
        2px 0 0 #2d3748,
        -4px 0 0 #1a202c,
        4px 0 0 #1a202c,
        0 -3px 6px rgba(0,0,0,0.3),
        0 3px 6px rgba(0,0,0,0.5);
    }

    /* Head */
    .wrench-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 50px;
      background: linear-gradient(135deg, #718096 0%, #4a5568 40%, #5a6577 60%, #718096 100%);
      border-radius: 10px 10px 4px 4px;
      box-shadow: 
        -3px 0 0 #3d4654,
        3px 0 0 #3d4654,
        -6px 0 0 #2d3748,
        6px 0 0 #2d3748,
        0 -4px 8px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(255,255,255,0.15);
    }

    /* Jaw opening */
    .wrench-jaw-opening {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 20px;
      background: var(--grass);
      border-radius: 4px 4px 0 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Jaw left */
    .wrench-jaw-l {
      position: absolute;
      top: -18px;
      left: 0;
      width: 16px;
      height: 30px;
      background: linear-gradient(90deg, #5a6577, #718096);
      border-radius: 6px 2px 2px 4px;
      box-shadow: -2px 0 0 #3d4654;
    }

    /* Jaw right */
    .wrench-jaw-r {
      position: absolute;
      top: -18px;
      right: 0;
      width: 16px;
      height: 30px;
      background: linear-gradient(90deg, #718096, #5a6577);
      border-radius: 2px 6px 4px 2px;
      box-shadow: 2px 0 0 #3d4654;
    }

    /* Neck connection */
    .wrench-neck {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 16px;
      background: linear-gradient(90deg, #3d4654, #5a6577, #3d4654);
      border-radius: 0 0 4px 4px;
      clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
    }

    /* Specular highlight */
    .wrench-specular {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 6px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      border-radius: 50%;
    }

    /* -- Footer -- */
    .portal-footer {
      position: fixed;
      bottom: 16px;
      font-size: 11px;
      color: var(--muted);
      z-index: 100;
      text-align: center;
      width: 100%;
    }

    @media (max-width: 600px) {
      .portal-stats { gap: 8px; }
      .stat-item { min-width: 70px; padding: 10px 14px; }
      .stat-item .num { font-size: 22px; }
      .wrench-wrapper { width: 90px; height: 170px; }
    }
  </style>
</head>
<body>

  <!-- ANIMATED BACKGROUND -->
  <div class="bg-scene">
    <!-- Roads -->
    <div class="road-h"></div>
    <div class="road-v"></div>
    <div class="intersection"></div>

    <!-- Buildings -->
    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"></div>
    <div class="building b6"></div>

    <!-- Trees -->
    <div class="tree t1"><div class="tree-top"></div><div class="tree-trunk"></div></div>
    <div class="tree t2"><div class="tree-top"></div><div class="tree-trunk"></div></div>
    <div class="tree t3"><div class="tree-top"></div><div class="tree-trunk"></div></div>
    <div class="tree t4"><div class="tree-top"></div><div class="tree-trunk"></div></div>

    <!-- Cars -->
    <div class="car car-right">
      <div class="car-body"></div>
      <div class="wheel front"></div>
      <div class="wheel rear"></div>
    </div>
    <div class="car car-left">
      <div class="car-body"></div>
      <div class="wheel front"></div>
      <div class="wheel rear"></div>
    </div>
    <div class="car car-down">
      <div class="car-body"></div>
      <div class="wheel front"></div>
      <div class="wheel rear"></div>
    </div>
    <div class="car car-up">
      <div class="car-body"></div>
      <div class="wheel front"></div>
      <div class="wheel rear"></div>
    </div>
  </div>

  <!-- PORTAL HEADER -->
  <div class="portal-header">
    <h1><span>🏠</span> Ampas Industries Portal</h1>
  </div>

  <!-- PORTAL CONTENT -->
  <div class="portal-overlay">
    <!-- Stats -->
    <div class="portal-stats">
      <div class="stat-item">
        <div class="num" style="color:var(--blue)">18</div>
        <div class="label">Projects</div>
      </div>
      <div class="stat-item">
        <div class="num" style="color:var(--green)">15</div>
        <div class="label">Worked</div>
      </div>
      <div class="stat-item">
        <div class="num" style="color:var(--red)">1</div>
        <div class="label">Failed</div>
      </div>
      <div class="stat-item">
        <div class="num" style="color:var(--amber)">2</div>
        <div class="label">Pitfall</div>
      </div>
    </div>

    <!-- 3D Wrench (Connected) -->
    <div class="wrench-wrapper">
      <div class="wrench-3d">
        <div class="wrench-main">
          <div class="wrench-jaw-l"></div>
          <div class="wrench-jaw-r"></div>
          <div class="wrench-jaw-opening"></div>
          <div class="wrench-head"></div>
          <div class="wrench-neck"></div>
          <div class="wrench-specular"></div>
          <div class="wrench-bar"></div>
        </div>
      </div>
    </div>

    <!-- Portal Button -->
    <a href="project-knowledge-base.html" class="portal-btn">
      <span class="icon">📋</span>
      View All Projects
      <span class="arrow">→</span>
    </a>
  </div>

  <!-- FOOTER -->
  <div class="portal-footer">Ampas Industries Co., Ltd. — Process Engineering Hub</div>

</body>
</html>
